<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invitation</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f6f9;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#111;
    }

    .card{
      background:#fff;
      width:90%;
      max-width:420px;
      padding:40px 30px;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
      text-align:center;
    }

    h1{
      font-size:28px;
      margin-bottom:14px;
      font-weight:600;
    }

    p{
      font-size:15px;
      color:#555;
      line-height:1.6;
      margin-bottom:30px;
    }

    .btn{
      display:inline-block;
      text-decoration:none;
      background:#111827;
      color:#fff;
      padding:14px 28px;
      border-radius:10px;
      font-size:15px;
      font-weight:500;
      transition:0.3s ease;
    }

    .btn:hover{
      background:#000;
      transform:translateY(-2px);
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Telegram Invitation</h1>

    <p>
      Access the Telegram bot directly using the secure invitation link below.
    </p>

    <a class="btn"
       href="https://telegram.me/share/url?url=https://t.me/funstarrrBot?start=010845BBF76076617466"
       target="_blank">
       Open Aerivue Telelog Bot
    </a>
  </div>

</body>
</html>
